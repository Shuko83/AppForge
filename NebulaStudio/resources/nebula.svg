<!-- The logo of Nebula: a nebula in the night sky, its violet, pink and blue clouds, crossed by three astres bound to
     one another, as the components of an application are by their interfaces. In the colors of the theme of
     NebulaStudio (Theme.cpp). nebula.ico is rendered from it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262046"/>
      <stop offset="1" stop-color="#0D0B1E"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F49AD3" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#EC4899" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8AB4FF" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#EEEAFE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#sky)"/>

  <!-- The clouds, which fade out before the edges. -->
  <ellipse cx="116" cy="112" rx="92" ry="58" fill="url(#violet)" transform="rotate(-35 116 112)"/>
  <ellipse cx="158" cy="150" rx="70" ry="48" fill="url(#pink)" transform="rotate(-35 158 150)"/>
  <ellipse cx="92" cy="166" rx="62" ry="38" fill="url(#blue)" transform="rotate(-35 92 166)"/>

  <!-- The astres and their bindings. -->
  <circle cx="128" cy="124" r="40" fill="url(#glow)"/>
  <path d="M 64 182 L 128 124 L 192 74" fill="none" stroke="#EEEAFE" stroke-width="6" stroke-linecap="round"
        stroke-opacity="0.8"/>
  <circle cx="64" cy="182" r="13" fill="#0D0B1E" stroke="#EEEAFE" stroke-width="6"/>
  <circle cx="128" cy="124" r="17" fill="#FFFFFF"/>
  <circle cx="192" cy="74" r="13" fill="#EEEAFE"/>

  <!-- Distant stars. -->
  <g fill="#EEEAFE">
    <path d="M 70 40 Q 70 58 88 58 Q 70 58 70 76 Q 70 58 52 58 Q 70 58 70 40 Z"/>
    <path d="M 204 160 Q 204 172 216 172 Q 204 172 204 184 Q 204 172 192 172 Q 204 172 204 160 Z"/>
    <circle cx="214" cy="40" r="3"/>
    <circle cx="44" cy="120" r="3"/>
    <circle cx="150" cy="214" r="3"/>
  </g>
</svg>
